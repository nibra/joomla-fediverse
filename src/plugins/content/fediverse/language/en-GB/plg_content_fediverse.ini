PLG_CONTENT_FEDIVERSE_EDITOR_GUIDANCE_DESC = "Remote readers often see this article without the full Joomla page context. Write a strong intro, add descriptive alt text in the Joomla Images tab before federating an article image, choose exactly which Joomla image to expose to remote readers, and decide whether hashtags should come from the article text, Joomla tags, both, or neither. Different Fediverse servers can render the same article differently, so test important publishing flows with the remote servers you care about."
PLG_CONTENT_FEDIVERSE_USE_INTRO_TEXT_LABEL = "Use intro text"
PLG_CONTENT_FEDIVERSE_USE_INTRO_TEXT_DESC = "Use the Joomla intro text as the federated post text. Turn this off only when the federated version needs a different standalone introduction."
PLG_CONTENT_FEDIVERSE_EXCERPT_LABEL = "Fediverse excerpt"
PLG_CONTENT_FEDIVERSE_EXCERPT_DESC = "Custom federated post text. Use this when the Joomla intro text is not the right standalone message for remote readers."
PLG_CONTENT_FEDIVERSE_INCLUDE_LINK_LABEL = "Include article link"
PLG_CONTENT_FEDIVERSE_INCLUDE_LINK_DESC = "Keep this enabled when remote readers should have a direct path back to the full Joomla article."
PLG_CONTENT_FEDIVERSE_IMAGE_SOURCE_LABEL = "Article image"
